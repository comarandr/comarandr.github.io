<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title | default: site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

  {% if page.custom_css %}
  <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
  {% endif %}
</head>

<body>

  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ page.title | default: site.title }}</a></h1>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>{{ site.footer | default: "Powered by Jekyll" }}</p>
  </footer>
</body>
</html>
