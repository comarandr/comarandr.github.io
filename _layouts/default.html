<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title | default: site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        macros: {
          everymath: ['\\displaystyle']
        }
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  {% if site.plugins contains 'jekyll-seo-tag' %}
    {% seo %}
  {% endif %}

  <!-- ============================================================
  MODIFICA 1 — Stili della sidebar
  Aggiunto un blocco <style> inline direttamente nel layout così
  non serve toccare style.css. Contiene:
    - il pulsante toggle fisso in alto a destra
    - il pannello sidebar (posizione fissa, larghezza, sfondo)
    - i livelli h1–h6 con indentatura progressiva (--depth)
    - la transizione visibile ↔ nascosta via classe .sidebar-hidden
    - lo scroll-spy: la voce attiva viene evidenziata in blu
    - il main si restringe/allarga in sincronia con la sidebar
  ============================================================ -->
  <style>
    /* — Pulsante toggle — — — — — — — — — — — — — — — — — — — */
    #toc-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 9999;
      background: #1a1a2e;
      color: #e8e8f0;
      border: none;
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 0.78rem;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: background 0.2s;
      /* Quando la sidebar è visibile il bottone stacca dal bordo
         per non sovrapporsi al contenuto della sidebar stessa  */
    }
    #toc-toggle:hover { background: #2e2e50; }

    /* — Sidebar — — — — — — — — — — — — — — — — — — — — — — — */
    #toc-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      width: 260px;
      height: 100vh;
      background: #1a1a2e;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 999;
      padding: 52px 0 2rem;   /* 52px = spazio per il bottone toggle */
      box-shadow: -3px 0 18px rgba(0,0,0,0.18);
      scrollbar-width: thin;
      scrollbar-color: #3a3a5c #1a1a2e;
      /* Transizione per apertura/chiusura fluida */
      transition: transform 0.28s ease;
    }
    /* Stato NASCOSTO: la sidebar scivola fuori schermo a destra */
    #toc-sidebar.sidebar-hidden {
      transform: translateX(100%);
    }

    /* — Intestazione interna "Indice" — — — — — — — — — — — — */
    #toc-sidebar .toc-header {
      padding: 0 1rem 0.5rem;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #5a5a8a;
      border-bottom: 1px solid #2a2a4a;
      margin-bottom: 0.4rem;
      font-family: system-ui, sans-serif;
    }

    /* — Lista voci TOC — — — — — — — — — — — — — — — — — — — */
    #toc-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #toc-list li a {
      display: block;
      /* Indentatura dinamica: ogni livello aggiunge 0.75rem
         grazie alla variabile CSS --depth impostata via JS    */
      padding: 0.32rem 0.75rem 0.32rem calc(0.9rem + var(--depth, 0) * 0.75rem);
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      color: #9898c8;
      text-decoration: none;
      border-left: 2px solid transparent;
      line-height: 1.35;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    #toc-list li a:hover {
      color: #e0e0f8;
      background: rgba(255,255,255,0.05);
    }
    /* Voce attiva (scroll-spy) */
    #toc-list li a.toc-active {
      color: #ffffff;
      border-left-color: #2563eb;
      background: rgba(37,99,235,0.14);
    }
    /* h1 in grassetto, peso visivo maggiore */
    #toc-list li.toc-h1 a { font-weight: 700; color: #b8b8e0; font-size: 0.8rem; }
    /* h4–h6 più tenue */
    #toc-list li.toc-h4 a,
    #toc-list li.toc-h5 a,
    #toc-list li.toc-h6 a { color: #6868a0; font-size: 0.73rem; }

    /* — Main: si stringe quando la sidebar è aperta — — — — — */
    body.toc-visible main {
      /* 260px = larghezza sidebar + 16px margine */
      margin-right: 276px;
      transition: margin-right 0.28s ease;
    }
    body:not(.toc-visible) main {
      margin-right: 0;
      transition: margin-right 0.28s ease;
    }
  </style>
  <!-- fine MODIFICA 1 ======================================== -->

</head>

<body>

  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>{{ site.footer | default: "Powered by Jekyll" }}</p>
  </footer>

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: false, theme: "default" });

  document.querySelectorAll('code.language-mermaid').forEach(function(el) {
    var div = document.createElement('div');
    div.classList.add('mermaid');
    div.textContent = el.textContent;
    el.parentNode.replaceWith(div);
  });

  mermaid.init(undefined, document.querySelectorAll('.mermaid'));
</script>

<!-- ============================================================
  MODIFICA 2 — HTML della sidebar + pulsante toggle
  Inseriti DOPO il footer così non interferiscono con il flusso
  del documento. Sono due elementi indipendenti:
    • #toc-toggle  → pulsante sempre visibile in alto a destra
    • #toc-sidebar → pannello con intestazione + lista vuota #toc-list
                     (riempita da JS in MODIFICA 3)
  ============================================================ -->
  <button id="toc-toggle" aria-label="Mostra/nascondi indice">☰ Indice</button>

  <aside id="toc-sidebar" class="sidebar-hidden" aria-label="Indice della pagina">
    <div class="toc-header">Indice</div>
    <ul id="toc-list"></ul>
  </aside>
  <!-- fine MODIFICA 2 ======================================== -->

  <!-- ============================================================
  MODIFICA 3 — JavaScript: costruzione TOC + toggle + scroll-spy

  Tre blocchi distinti:

  A) buildTOC()
     Legge tutti gli heading h1–h6 dentro <main>.
     Per ogni heading:
       - assegna un id univoco se non ce l'ha già
       - crea un <li> con classe toc-hN
       - imposta la variabile CSS --depth (0 per h1, 1 per h2, …)
         che guida l'indentatura nel CSS (MODIFICA 1)
       - aggiunge la voce alla lista #toc-list

  B) initToggle()
     Legge da localStorage se l'utente aveva lasciato la sidebar
     aperta o chiusa nell'ultima visita (così lo stato persiste
     tra una pagina e l'altra).
     Al click del bottone:
       - aggiunge/rimuove .sidebar-hidden sulla sidebar
       - aggiunge/rimuove .toc-visible su <body> (controlla il
         margin-right del main via CSS, MODIFICA 1)
       - salva la preferenza in localStorage

  C) initScrollSpy()
     Usa IntersectionObserver per rilevare quale heading è
     attualmente nella parte alta del viewport.
     Aggiunge la classe .toc-active al link corrispondente e la
     rimuove dagli altri, in tempo reale durante lo scroll.
  ============================================================ -->
  <script>
    /* ── A) Costruzione TOC ─────────────────────────────────── */
    function buildTOC() {
      const headings = document.querySelectorAll('main h1, main h2, main h3, main h4, main h5, main h6');
      const list = document.getElementById('toc-list');
      if (!list || headings.length === 0) return;

      headings.forEach(function(h, i) {
        // Assegna id univoco se mancante (kramdown di solito li genera,
        // ma questo garantisce il funzionamento anche senza plugin)
        if (!h.id) h.id = 'toc-heading-' + i;

        const level = parseInt(h.tagName[1], 10); // 1–6
        const depth = level - 1;                  // 0–5 per l'indentatura

        const li = document.createElement('li');
        li.className = 'toc-h' + level;

        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        // Imposta --depth come proprietà CSS inline sul <li>
        li.style.setProperty('--depth', depth);

        li.appendChild(a);
        list.appendChild(li);
      });
    }

    /* ── B) Toggle visibile / nascosta ─────────────────────── */
    function initToggle() {
      const sidebar  = document.getElementById('toc-sidebar');
      const btn      = document.getElementById('toc-toggle');
      const STOR_KEY = 'tocVisible';

      // Ripristina stato precedente (default: nascosta)
      const wasVisible = localStorage.getItem(STOR_KEY) === 'true';
      if (wasVisible) {
        sidebar.classList.remove('sidebar-hidden');
        document.body.classList.add('toc-visible');
        btn.textContent = '✕ Indice';
      }

      btn.addEventListener('click', function() {
        const hidden = sidebar.classList.toggle('sidebar-hidden');
        document.body.classList.toggle('toc-visible', !hidden);
        btn.textContent = hidden ? '☰ Indice' : '✕ Indice';
        localStorage.setItem(STOR_KEY, !hidden);
      });
    }

    /* ── C) Scroll-spy ──────────────────────────────────────── */
    function initScrollSpy() {
      const links = document.querySelectorAll('#toc-list a');
      if (!links.length) return;

      // rootMargin: l'heading viene considerato "attivo" quando
      // entra nel 15% superiore del viewport
      const observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            links.forEach(function(l) { l.classList.remove('toc-active'); });
            const active = document.querySelector(
              '#toc-list a[href="#' + entry.target.id + '"]'
            );
            if (active) active.classList.add('toc-active');
          }
        });
      }, { rootMargin: '-8% 0px -80% 0px' });

      document.querySelectorAll('main h1, main h2, main h3, main h4, main h5, main h6')
        .forEach(function(h) { observer.observe(h); });
    }

    /* ── Avvio ──────────────────────────────────────────────── */
    buildTOC();
    initToggle();
    initScrollSpy();
  </script>
  <!-- fine MODIFICA 3 ======================================== -->

</body>
</html>
