<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title | default: site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">

  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        macros: {
          everymath: ['\\displaystyle']
        }
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

  {% if site.plugins contains 'jekyll-seo-tag' %}
    {% seo %}
  {% endif %}
</head>

<body>

  <header>
    <h1><a href="{{ '/' | relative_url }}">{{ page.title | default: site.title }}</a></h1>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <p>{{ site.footer | default: "Powered by Jekyll" }}</p>
  </footer>

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: false, theme: "default" });

  document.querySelectorAll('code.language-mermaid').forEach(function(el) {
    var div = document.createElement('div');
    div.classList.add('mermaid');
    div.textContent = el.textContent;
    el.parentNode.replaceWith(div);
  });

  mermaid.init(undefined, document.querySelectorAll('.mermaid'));
</script>

 <!-- ============================================================
  MODIFICA 2 — HTML della sidebar + pulsante toggle
  Inseriti DOPO il footer così non interferiscono con il flusso
  del documento. Sono due elementi indipendenti:
    • #toc-toggle  → pulsante sempre visibile in alto a destra
    • #toc-sidebar → pannello con intestazione + lista vuota #toc-list
                     (riempita da JS in MODIFICA 3)
  ============================================================ -->
  <button id="toc-toggle" aria-label="Mostra/nascondi indice">☰ Indice</button>

  <aside id="toc-sidebar" class="sidebar-hidden" aria-label="Indice della pagina">
    <div class="toc-header">Indice</div>
    <ul id="toc-list"></ul>
  </aside>
  <!-- fine MODIFICA 2 ======================================== -->

  <!-- ============================================================
  MODIFICA 3 — JavaScript: costruzione TOC + toggle + scroll-spy

  Tre blocchi distinti:

  A) buildTOC()
     Legge tutti gli heading h1–h6 dentro <main>.
     Per ogni heading:
       - assegna un id univoco se non ce l'ha già
       - crea un <li> con classe toc-hN
       - imposta la variabile CSS --depth (0 per h1, 1 per h2, …)
         che guida l'indentatura nel CSS (MODIFICA 1)
       - aggiunge la voce alla lista #toc-list

  B) initToggle()
     Legge da localStorage se l'utente aveva lasciato la sidebar
     aperta o chiusa nell'ultima visita (così lo stato persiste
     tra una pagina e l'altra).
     Al click del bottone:
       - aggiunge/rimuove .sidebar-hidden sulla sidebar
       - aggiunge/rimuove .toc-visible su <body> (controlla il
         margin-right del main via CSS, MODIFICA 1)
       - salva la preferenza in localStorage

  C) initScrollSpy()
     Usa IntersectionObserver per rilevare quale heading è
     attualmente nella parte alta del viewport.
     Aggiunge la classe .toc-active al link corrispondente e la
     rimuove dagli altri, in tempo reale durante lo scroll.
  ============================================================ -->
  <script>
    /* ── A) Costruzione TOC ─────────────────────────────────── */
    function buildTOC() {
      const headings = document.querySelectorAll('main h1, main h2, main h3, main h4, main h5, main h6');
      const list = document.getElementById('toc-list');
      if (!list || headings.length === 0) return;

      headings.forEach(function(h, i) {
        // Assegna id univoco se mancante (kramdown di solito li genera,
        // ma questo garantisce il funzionamento anche senza plugin)
        if (!h.id) h.id = 'toc-heading-' + i;

        const level = parseInt(h.tagName[1], 10); // 1–6
        const depth = level - 1;                  // 0–5 per l'indentatura

        const li = document.createElement('li');
        li.className = 'toc-h' + level;

        const a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        // Imposta --depth come proprietà CSS inline sul <li>
        li.style.setProperty('--depth', depth);

        li.appendChild(a);
        list.appendChild(li);
      });
    }

    /* ── B) Toggle visibile / nascosta ─────────────────────── */
    function initToggle() {
      const sidebar  = document.getElementById('toc-sidebar');
      const btn      = document.getElementById('toc-toggle');
      const STOR_KEY = 'tocVisible';

      // Ripristina stato precedente (default: nascosta)
      const wasVisible = localStorage.getItem(STOR_KEY) === 'true';
      if (wasVisible) {
        sidebar.classList.remove('sidebar-hidden');
        document.body.classList.add('toc-visible');
        btn.textContent = '✕ Indice';
      }

      btn.addEventListener('click', function() {
        const hidden = sidebar.classList.toggle('sidebar-hidden');
        document.body.classList.toggle('toc-visible', !hidden);
        btn.textContent = hidden ? '☰ Indice' : '✕ Indice';
        localStorage.setItem(STOR_KEY, !hidden);
      });
    }

    /* ── C) Scroll-spy ──────────────────────────────────────── */
    function initScrollSpy() {
      const links = document.querySelectorAll('#toc-list a');
      if (!links.length) return;

      // rootMargin: l'heading viene considerato "attivo" quando
      // entra nel 15% superiore del viewport
      const observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            links.forEach(function(l) { l.classList.remove('toc-active'); });
            const active = document.querySelector(
              '#toc-list a[href="#' + entry.target.id + '"]'
            );
            if (active) active.classList.add('toc-active');
          }
        });
      }, { rootMargin: '-8% 0px -80% 0px' });

      document.querySelectorAll('main h1, main h2, main h3, main h4, main h5, main h6')
        .forEach(function(h) { observer.observe(h); });
    }

    /* ── Avvio ──────────────────────────────────────────────── */
    buildTOC();
    initToggle();
    initScrollSpy();
  </script>
  <!-- fine MODIFICA 3 ======================================== -->

</body>
</html>
